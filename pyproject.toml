[project]
name = "oozedle"
version = "0.1.0"
description = "Daily stat-line guessing game and all-time stats for Ooze ultimate."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdown>=5.2.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "requests",
    "beautifulsoup4",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oozedle"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
extend-exclude = ["oozedle/stats.py", "scripts/setup_site.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
